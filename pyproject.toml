[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-safe-programming-xss-analysis"
version = "0.1.0"
description = "XSS coursework analysis and a local deliberately vulnerable Flask application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "cryptography>=40,<47",
    "Flask>=2.3,<4",
    "itsdangerous>=2.1,<3",
    "Jinja2>=3.1,<4",
]

[project.scripts]
start-xss-app = "XSSApp.app:start_app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
]

[tool.setuptools]
packages = ["XSSApp", "solution"]
include-package-data = false

[tool.setuptools.package-dir]
XSSApp = "framework/XSSApp-1.1.0/XSSApp"
solution = "solution"

[tool.setuptools.package-data]
XSSApp = ["static/*.ico", "templates/*.html"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
exclude = ["framework", "third_party"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
